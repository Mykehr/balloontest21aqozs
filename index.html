<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

<body style="margin: 0; overflow: hidden;">
  <a-scene
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    id="scene"
    embedded
    gesture-detector
  >
    <a-assets>
      <a-asset-item
        id="animated-asset"
        src="assets/asset.glb"
      ></a-asset-item>
    </a-assets>

    <a-marker
      id="markerA"
      type="pattern"
      preset="custom"
      url="assets/marker.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <!-- 風船を大量発生させる親 -->
      <a-entity
        id="balloon-system"
        balloon-spawner="count: 100; radius: 2.2; minY: -3.2; maxY: 4.8; baseScale: 0.14;"
      ></a-entity>
    </a-marker>

    <a-entity light="type: ambient; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; position: 1 3 2"></a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('balloon-spawner', {
      schema: {
        count: { type: 'int', default: 100 },
        radius: { type: 'number', default: 2.2 },
        minY: { type: 'number', default: -3.2 },
        maxY: { type: 'number', default: 4.8 },
        baseScale: { type: 'number', default: 0.14 }
      },

      init: function () {
        this.balloons = [];
        this.modelId = '#animated-asset';

        for (let i = 0; i < this.data.count; i++) {
          const balloon = document.createElement('a-entity');
          balloon.setAttribute('gltf-model', this.modelId);
          balloon.setAttribute('class', 'clickable');

          const state = this.makeBalloonState(true);

          balloon.object3D.position.set(state.x, state.y, state.z);
          balloon.object3D.rotation.set(state.rx, state.ry, state.rz);
          balloon.object3D.scale.set(state.scale, state.scale, state.scale);

          balloon.setAttribute('animation-mixer', 'loop: repeat');

          this.el.appendChild(balloon);
          this.balloons.push({ el: balloon, state });
        }
      },

      makeBalloonState: function (randomiseStartHeight = false) {
        const angle = Math.random() * Math.PI * 2;
        const spread = Math.random() * this.data.radius;

        const x = Math.cos(angle) * spread;
        const z = Math.sin(angle) * spread;

        const startY = randomiseStartHeight
          ? this.data.minY + Math.random() * (this.data.maxY - this.data.minY)
          : this.data.minY;

        const scale = this.data.baseScale * (0.8 + Math.random() * 0.55);

        return {
          x: x,
          y: startY,
          z: z,

          baseX: x,
          baseZ: z,

          // 少し斜めに流れる移動量
          driftX: (Math.random() - 0.5) * 0.35,
          driftZ: (Math.random() - 0.5) * 0.35,

          // 上昇速度
          speedY: 0.45 + Math.random() * 0.5,

          // 横揺れ
          swayAmpX: 0.03 + Math.random() * 0.08,
          swayAmpZ: 0.03 + Math.random() * 0.08,
          swayFreqX: 0.7 + Math.random() * 1.4,
          swayFreqZ: 0.7 + Math.random() * 1.4,
          swayPhaseX: Math.random() * Math.PI * 2,
          swayPhaseZ: Math.random() * Math.PI * 2,

          // わずかな回転
          rx: (Math.random() - 0.5) * 0.2,
          ry: Math.random() * Math.PI * 2,
          rz: (Math.random() - 0.5) * 0.2,

          rotSpeedX: (Math.random() - 0.5) * 0.35,
          rotSpeedY: (Math.random() - 0.5) * 0.9,
          rotSpeedZ: (Math.random() - 0.5) * 0.35,

          scale: scale,

          // フェード
          opacity: 0.15 + Math.random() * 0.85,

          // 個体ごとの時間ずらし
          age: Math.random() * 10
        };
      },

      tick: function (time, timeDelta) {
        const dt = timeDelta / 1000;
        const t = time / 1000;

        for (let i = 0; i < this.balloons.length; i++) {
          const balloon = this.balloons[i];
          const el = balloon.el;
          const s = balloon.state;

          s.age += dt;
          s.y += s.speedY * dt;

          // 上昇しながら少し斜めに流れる
          const progress = (s.y - this.data.minY) / (this.data.maxY - this.data.minY);
          const driftFactor = Math.max(0, Math.min(progress, 1));

          const px =
            s.baseX +
            s.driftX * driftFactor +
            Math.sin(t * s.swayFreqX + s.swayPhaseX) * s.swayAmpX;

          const pz =
            s.baseZ +
            s.driftZ * driftFactor +
            Math.cos(t * s.swayFreqZ + s.swayPhaseZ) * s.swayAmpZ;

          el.object3D.position.set(px, s.y, pz);

          // わずかな回転
          el.object3D.rotation.x += s.rotSpeedX * dt;
          el.object3D.rotation.y += s.rotSpeedY * dt;
          el.object3D.rotation.z += s.rotSpeedZ * dt;

          // 出始めと消え際をやわらかく
          let opacity = 1.0;
          const fadeInRange = 0.18;
          const fadeOutRange = 0.2;

          if (progress < fadeInRange) {
            opacity = progress / fadeInRange;
          } else if (progress > 1.0 - fadeOutRange) {
            opacity = (1.0 - progress) / fadeOutRange;
          }

          opacity = Math.max(0, Math.min(1, opacity));

          this.setModelOpacity(el, opacity);

          // 上まで行ったら再生成
          if (s.y > this.data.maxY) {
            const newState = this.makeBalloonState(false);
            balloon.state = newState;

            el.object3D.position.set(newState.x, newState.y, newState.z);
            el.object3D.rotation.set(newState.rx, newState.ry, newState.rz);
            el.object3D.scale.set(newState.scale, newState.scale, newState.scale);
          }
        }
      },

      setModelOpacity: function (entity, opacity) {
        entity.object3D.traverse((node) => {
          if (!node.isMesh || !node.material) return;

          const materials = Array.isArray(node.material)
            ? node.material
            : [node.material];

          materials.forEach((mat) => {
            mat.transparent = true;
            mat.opacity = opacity;
            mat.needsUpdate = true;
          });
        });
      }
    });
  </script>
</body>
